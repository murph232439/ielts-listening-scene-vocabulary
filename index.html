<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f5f1">
    <meta

      content="雅思听力场景词汇学习与限时听写训练"

            <span>场景</span>
